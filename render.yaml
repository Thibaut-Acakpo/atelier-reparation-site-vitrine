# Blueprint Render : base PostgreSQL + API + frontend statique.
# Les ateliers (clients) se créent ensuite depuis /gestion, sans nouveau déploiement.

databases:
  - name: atelier-reparation-db
    plan: free

services:
  - type: web
    name: atelier-reparation-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: 22.20.0

      - key: NODE_ENV
        value: production

      # URL du frontend déployé (ex. https://atelier-reparation.onrender.com)
      - key: FRONTEND_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 8h

      - key: TRACKING_SALT
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: atelier-reparation-db
          property: connectionString

      - key: UPLOAD_DIR
        value: ./uploads

      - key: MAX_UPLOAD_SIZE
        value: "5242880"

      # Votre compte développeur (créé automatiquement au premier démarrage)
      - key: DEVELOPER_EMAIL
        sync: false

      - key: DEVELOPER_PASSWORD
        sync: false

      - key: DEVELOPER_NAME
        value: Développeur

  - type: web
    name: atelier-reparation
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # URL de l'API (ex. https://atelier-reparation-backend.onrender.com)
      - key: VITE_API_URL
        sync: false
